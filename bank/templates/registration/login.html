{% extends "bank/base.html" %}{% block content %}
<h1>Log in</h1>
{% if form.errors %}<p class="err">Incorrect username or password.</p>{% endif %}
<form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {{ form.as_p }}<button>Log in</button>
</form>
{% endblock %}
